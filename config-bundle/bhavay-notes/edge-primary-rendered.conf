# GENERATED by scripts/render.sh from templates/nginx.conf.tmpl - do not edit by hand.
# Role: primary edge (reverse proxy + load balancer + TLS termination)
# Tasks D, E and Extension D / E.

worker_processes 1;
pid        /Users/bhavaygoyal/desktop/cn-project/run/nginx-primary.pid;
error_log  /Users/bhavaygoyal/desktop/cn-project/run/logs/edge-primary-error.log warn;

events {
    worker_connections 256;
}

http {
    default_type application/json;

    # Keep nginx's scratch files inside the project (no system paths touched).
    client_body_temp_path /Users/bhavaygoyal/desktop/cn-project/run/nginx-tmp/body;
    proxy_temp_path       /Users/bhavaygoyal/desktop/cn-project/run/nginx-tmp/proxy;
    fastcgi_temp_path     /Users/bhavaygoyal/desktop/cn-project/run/nginx-tmp/fastcgi;
    uwsgi_temp_path       /Users/bhavaygoyal/desktop/cn-project/run/nginx-tmp/uwsgi;
    scgi_temp_path        /Users/bhavaygoyal/desktop/cn-project/run/nginx-tmp/scgi;

    # One access-log line per request = evidence of client socket, TLS version
    # and WHICH backend served it.
    log_format edge '$time_local client=$remote_addr:$remote_port '
                    'edge=$server_addr:$server_port host=$host "$request" '
                    'status=$status proto=$server_protocol tls=$ssl_protocol '
                    'upstream=$upstream_addr upstream_status=$upstream_status '
                    'time=$request_time';
    access_log /Users/bhavaygoyal/desktop/cn-project/run/logs/edge-primary-access.log edge;

    # ------------------------------------------------------------------
    # Task D - the backend pool. No algorithm keyword = ROUND ROBIN.
    # (Swap in "least_conn;" here to demo another strategy.)
    #
    # Extension D - passive health checking: if a backend fails once
    # (connection refused / timeout) it is taken out of rotation for 10 s,
    # then nginx tries it again. When it is back, round robin resumes.
    # ------------------------------------------------------------------
    upstream backends {
        server 10.7.23.55:3001 max_fails=1 fail_timeout=10s;
        server 10.7.27.44:3002 max_fails=1 fail_timeout=10s;
    }

    # Plain HTTP only redirects to HTTPS.
    server {
        listen 80;
        server_name app.team67.test api.team67.test;
        add_header X-Edge "primary (10.7.27.44)" always;
        return 301 https://$host$request_uri;
    }

    # ------------------------------------------------------------------
    # Task E - HTTPS. TLS is TERMINATED here: client<->edge is encrypted,
    # edge<->backend is plain HTTP inside our private LAN.
    # ------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name app.team67.test api.team67.test;

        ssl_certificate     /Users/bhavaygoyal/desktop/cn-project/certs/server.crt;
        ssl_certificate_key /Users/bhavaygoyal/desktop/cn-project/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:1m;

        # Tells you which edge answered (primary vs standby, Extension E).
        add_header X-Edge "primary (10.7.27.44)" always;

        location / {
            proxy_pass http://backends;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Extension D - fail fast and retry the OTHER backend so the
            # client never sees the failure of a single backend.
            proxy_connect_timeout 2s;
            proxy_read_timeout    10s;
            proxy_next_upstream   error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }
    }
}
